name: Refresh Ticket Data

on:
  schedule:
    # Hourly safety net at :05 past every hour.
    # If the self-trigger chain ever breaks (e.g. GitHub API 500),
    # this restarts it automatically within 60 min.
    # cancel-in-progress: false means this safely queues behind a sleeping
    # self_trigger rather than cancelling it.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Queue rather than cancel — prevents cron from killing the sleeping self_trigger
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Job 1: Fetch tickets from Jira and deploy to GitHub Pages ──────────────
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch tickets from Jira
        env:
          JIRA_EMAIL:    ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: python fetch_tickets.py

      - name: Commit & push tickets.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickets.json
          git diff --staged --quiet || \
            git commit -m "chore: refresh tickets [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ── Job 2: Self-trigger with retry ─────────────────────────────────────────
  # Sleeps 30 min then dispatches the next run.
  # Retries up to 5 times (60 s apart) if GitHub API returns a transient error
  # (e.g. HTTP 500). If all retries fail, the hourly cron above restarts
  # the chain within 60 min automatically.
  self_trigger:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: self-trigger
      cancel-in-progress: false

    steps:
      - name: Sleep 30 min then dispatch next refresh (with retry)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "⚠️  GH_PAT secret not set — self-trigger disabled."
            echo "    Hourly cron will still run as safety net."
            exit 0
          fi

          echo "✅ Refresh complete. Sleeping 30 min before scheduling next run..."
          sleep 1800

          MAX_RETRIES=5
          RETRY_DELAY=60

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "🔄 Dispatch attempt $attempt/$MAX_RETRIES..."

            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_PAT" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/GWS-Ohmer/gws-ticket-dashboard/actions/workflows/refresh.yml/dispatches \
              -d '{"ref":"main"}')

            if [ "$HTTP" = "204" ]; then
              echo "✅ Next refresh dispatched (HTTP 204) — chain continues"
              exit 0
            fi

            echo "⚠️  GitHub API returned HTTP $HTTP"

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "   Waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ All $MAX_RETRIES dispatch attempts failed."
          echo "   Hourly cron (at :05) will restart the chain within 60 min."
