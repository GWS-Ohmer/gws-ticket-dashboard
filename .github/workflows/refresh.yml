name: Refresh Ticket Data

on:
  schedule:
    # Daily safety net at midnight — restarts the self-trigger chain if it ever breaks.
    # Primary scheduling is done by the self_trigger job below (more reliable on this repo).
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # queue rather than cancel — keeps run history clean (success, not cancelled)

jobs:
  # ── Job 1: Fetch tickets from Jira and deploy to GitHub Pages ──────────────
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch tickets from Jira
        env:
          JIRA_EMAIL:    ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: python fetch_tickets.py

      - name: Commit & push tickets.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickets.json
          git diff --staged --quiet || \
            git commit -m "chore: refresh tickets [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ── Job 2: Self-trigger — sleeps 30 min then dispatches the next run ────────
  # More reliable than GitHub's built-in cron scheduler on new/low-activity repos.
  # Each run dispatches the next one, creating a self-sustaining 30-min chain.
  # Requires: GH_PAT secret (Fine-grained PAT, Actions: Read & Write on this repo).
  self_trigger:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: self-trigger
      cancel-in-progress: false

    steps:
      - name: Wait 30 min then dispatch next refresh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "⚠️  GH_PAT secret not set — self-trigger disabled."
            exit 0
          fi

          echo "✅ Refresh complete. Sleeping 30 min before scheduling next run..."
          sleep 1800

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/GWS-Ohmer/gws-ticket-dashboard/actions/workflows/refresh.yml/dispatches \
            -d '{"ref":"main"}')

          if [ "$HTTP" = "204" ]; then
            echo "✅ Next refresh dispatched (HTTP 204) — chain continues"
          else
            echo "❌ Dispatch failed (HTTP $HTTP) — check GH_PAT permissions"
          fi
