name: Refresh Ticket Data

on:
  schedule:
    # Backup cron — kept as safety net but unreliable on new repos.
    # Primary scheduling is handled by the self-trigger job below.
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:

# Permissions required for git push and GitHub Pages deploy
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deploy at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Job 1: Fetch tickets from Jira and deploy to Pages ─────────────────────
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch tickets from Jira
        env:
          JIRA_EMAIL:    ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: python fetch_tickets.py

      - name: Commit & push tickets.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickets.json
          git diff --staged --quiet || \
            git commit -m "chore: refresh tickets [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ── Job 2: Self-trigger — waits 10 min then dispatches the next run ────────
  # This makes the refresh perpetually self-sustaining without relying on
  # GitHub's unreliable cron scheduler for new repositories.
  #
  # REQUIRES: GH_PAT secret (Fine-grained PAT, Actions: Read & Write on this repo)
  # Setup:    https://github.com/settings/tokens?type=beta
  #           → Repo: gws-ticket-dashboard → Permissions: Actions = Read & Write
  #           → Add as secret GH_PAT in this repo's Settings → Secrets
  #
  # Behaviour:
  #   - Runs after "refresh" job succeeds
  #   - Sleeps 10 minutes (free on public repos — unlimited Actions minutes)
  #   - Calls workflow_dispatch via PAT to start the next refresh cycle
  #   - Uses its own concurrency group so Pages deploys don't cancel the sleep
  self_trigger:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: self-trigger
      cancel-in-progress: false   # queue rather than cancel if two are pending

    steps:
      - name: Wait 10 min then dispatch next refresh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "⚠️  GH_PAT secret not set."
            echo "    Add it to enable automatic 10-min self-trigger refresh."
            echo "    Guide: https://github.com/settings/tokens?type=beta"
            exit 0
          fi

          echo "✅ Refresh complete. Sleeping 10 min before scheduling next run..."
          sleep 600

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/GWS-Ohmer/gws-ticket-dashboard/actions/workflows/refresh.yml/dispatches \
            -d '{"ref":"main"}')

          if [ "$HTTP" = "204" ]; then
            echo "✅ Next refresh dispatched successfully (HTTP 204)"
          else
            echo "❌ Dispatch failed (HTTP $HTTP) — check GH_PAT permissions"
          fi
