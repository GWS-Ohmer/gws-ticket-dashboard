name: Refresh Ticket Data

on:
  schedule:
    # Hourly at :05 past every hour.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Separate concurrency group from pages.yml (which uses group: "pages").
# Using "refresh-data" prevents the two workflows from blocking each other.
concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  # ── Fetch tickets from Jira and deploy to GitHub Pages ──────────────────────
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch tickets from Jira
        env:
          JIRA_EMAIL:    ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: python fetch_tickets.py

      - name: Commit & push tickets.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickets.json
          git diff --staged --quiet || \
            git commit -m "chore: refresh tickets [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
