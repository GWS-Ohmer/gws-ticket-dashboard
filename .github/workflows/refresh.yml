name: Refresh Ticket Data

on:
  schedule:
    # Every 15 minutes — GitHub Actions minimum granularity
    - cron: "*/15 * * * *"
  workflow_dispatch:   # allow manual trigger from the Actions tab

# Permissions required for both git push and GitHub Pages deploy
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel any in-flight deploy if a new one starts
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch tickets from Jira
        env:
          JIRA_EMAIL:    ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: python fetch_tickets.py

      - name: Commit & push tickets.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickets.json
          # only commit when the file actually changed
          git diff --staged --quiet || \
            git commit -m "chore: refresh tickets [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      # ── Deploy the updated repo (including fresh tickets.json) to Pages ──
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."   # serve the repo root: dashboard.html + tickets.json

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
